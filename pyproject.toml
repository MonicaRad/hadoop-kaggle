[project]
name = "tp-bigdata-lakehouse"
version = "0.1.0"
description = "TP Big Data Lakehouse : HDFS (3 DataNodes) + PySpark + Delta Lake + Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
    "streamlit>=1.39",
    "plotly>=5.24",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "kagglehub>=0.3",
    "ruff>=0.7",
    "pytest>=8.3",
]
